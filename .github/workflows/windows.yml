name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl requests lxml pyinstaller pillow
      - run: npm install --ignore-scripts
      - run: python testes_classificacao.py
      - run: python -m unittest discover -s tests
      - run: npx esbuild fonte_relatorio/candles.js --bundle --platform=node --format=cjs --outfile=tests/candles-test-bundle.cjs
      - run: node tests/candles-test.cjs
      - run: npx esbuild fonte_relatorio/analitica.js --bundle --platform=node --format=cjs --outfile=tests/analitica-test-bundle.cjs
      - run: node tests/analitica-test.cjs
      - run: python build.py
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/setup.iss' 
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: SLT-Gestao-de-Gastos-Windows
          path: dist/SLT-Gestao-de-Gastos-Setup-*.exe
      - name: Publicar instalador e checksum da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = Get-ChildItem dist/SLT-Gestao-de-Gastos-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $($file.Name)`n", [System.Text.UTF8Encoding]::new($false))
          gh release create "${{ github.ref_name }}" $file.FullName dist/SHA256SUMS.txt --title "SLT Gestão de Gastos ${{ github.ref_name }}" --notes "Instalador Windows. Consulte o README para formatos suportados e limitações."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
